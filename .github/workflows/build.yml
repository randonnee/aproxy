name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install UI dependencies
        run: bun install
        working-directory: ui

      - name: Build desktop app
        run: bunx electrobun build --env=stable
        env:
          NODE_ENV: production

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Aproxy.dmg
          path: artifacts/stable-macos-arm64-Aproxy.dmg
          compression-level: 0
